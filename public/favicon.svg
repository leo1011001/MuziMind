<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Brain shape -->
  <g fill="url(#g)">
    <!-- Left hemisphere -->
    <ellipse cx="38" cy="45" rx="18" ry="22"/>
    <!-- Right hemisphere -->
    <ellipse cx="62" cy="45" rx="18" ry="22"/>
    <!-- Center bridge -->
    <rect x="44" y="30" width="12" height="30" rx="4"/>
    <!-- Stem -->
    <rect x="44" y="64" width="12" height="10" rx="3"/>
    <!-- Brain fold lines left -->
    <rect x="24" y="38" width="10" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <rect x="22" y="46" width="12" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <rect x="25" y="54" width="8" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <!-- Brain fold lines right -->
    <rect x="66" y="38" width="10" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <rect x="66" y="46" width="12" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <rect x="67" y="54" width="8" height="3" rx="1.5" fill="white" opacity="0.35"/>
  </g>
</svg>
